version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: relay_postgres
    restart: always
    environment:
      POSTGRES_USER: relay_user
      POSTGRES_PASSWORD: relay_password
      POSTGRES_DB: relay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: relay_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://relay_user:relay_password@db:5432/relay_db
      SECRET_KEY: dev-insecure-secret-key-for-local-docker-cluster-only
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
